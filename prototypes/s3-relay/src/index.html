<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src http: https: ws: wss:; form-action 'none'; base-uri 'none'">
  <title>S-3: Relay</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; max-width: 60rem; }
    fieldset { margin-bottom: 1rem; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    input[type=text] { min-width: 12rem; }
    pre { background: #8881; padding: .5rem; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h1>S-3: Relay</h1>
  <fieldset>
    <legend>Relay</legend>
    <input type="text" id="relay-url" value="http://127.0.0.1:8765">
    <input type="text" id="relay-token" placeholder="token">
    <button id="info">Check</button>
  </fieldset>
  <fieldset>
    <legend>TCP</legend>
    <input type="text" id="host" value="localhost"> <input type="text" id="port" value="25" size="5">
    <label><input type="checkbox" id="tls"> TLS</label>
    <button id="connect">Connect</button>
    <input type="text" id="line" placeholder="line to send"> <button id="send">Send</button>
    <button id="starttls">STARTTLS</button>
  </fieldset>
  <fieldset>
    <legend>HTTP</legend>
    <input type="text" id="url" value="https://example.org/"> <button id="get">GET</button>
  </fieldset>
  <pre id="log"></pre>
  <script src="../../../shared/js/relay.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
